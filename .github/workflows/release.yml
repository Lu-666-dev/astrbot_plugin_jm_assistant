name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name, for example v1.0.0"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: write

env:
  PLUGIN_NAME: astrbot_plugin_jm_assistant

jobs:
  build-and-release:
    name: Build and publish plugin release
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_name="$DISPATCH_TAG"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag_name"
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "archive_name=${PLUGIN_NAME}-${tag_name}.zip" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Build plugin archive
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          set -euo pipefail

          mkdir -p "$PLUGIN_NAME"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='dist' \
            --exclude='build' \
            --exclude="$PLUGIN_NAME" \
            ./ "$PLUGIN_NAME/"

          zip -r "$ARCHIVE_NAME" "$PLUGIN_NAME"
          unzip -l "$ARCHIVE_NAME"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ARCHIVE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" "$ARCHIVE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "机长小助手 $TAG_NAME" \
              --generate-notes
          fi
